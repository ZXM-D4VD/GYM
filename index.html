<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFuel Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; background: #1e293b; border-radius: 16px; padding: 20px; position: relative; overflow: hidden; }
        
        /* Header & Nav Drawer */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .menu-btn { font-size: 24px; cursor: pointer; background: none; border: none; color: #38bdf8; width: auto; padding: 0; }
        .drawer { position: absolute; top: 0; left: -100%; width: 80%; height: 100%; background: #0f172a; z-index: 10; transition: 0.3s ease; padding: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .drawer.active { left: 0; }
        .close-btn { text-align: right; font-size: 20px; cursor: pointer; color: #ef4444; margin-bottom: 15px; }

        /* General UI Elements */
        .card { background: #334155; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        h2 { font-size: 15px; color: #cbd5e1; margin-bottom: 10px; display: flex; justify-content: space-between; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin: 5px 0 10px; outline: none; }
        button { width: 100%; padding: 10px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .badge { background: #0284c7; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .alert { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; display: none; }
        .alert-warn { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .alert-safe { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #86efac; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <h1>FitFuel Pro</h1>
        <button class="menu-btn" onclick="toggleDrawer(true)">☰</button>
    </div>

    <!-- Side Menu Drawer (Cheat Meal & Calorie Smart Calc) -->
    <div class="drawer" id="drawer">
        <div class="close-btn" onclick="toggleDrawer(false)">✕ Close</div>
        <div class="card">
            <h2>🍕 Smart Cheat Meal Calc</h2>
            <label style="font-size: 12px; color: #94a3b8;">Select Cheat Food:</label>
            <select id="cheatFood">
                <option value="280">Pizza (1 Slice - 280 kcal)</option>
                <option value="540">Burger (1 Unit - 540 kcal)</option>
                <option value="300">Samosa (2 Pcs - 300 kcal)</option>
                <option value="450">Biryani (1 Bowl - 450 kcal)</option>
            </select>
            <button onclick="calcCheatBurn()">Calculate Burn Time</button>
            <div id="cheatResult" class="alert alert-warn"></div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="card">
        <h2>📱 Screen Time Tracker <span id="screenTimer" class="badge">0m 0s</span></h2>
        <p id="screenWarn" style="font-size: 11px; color: #ef4444; display:none;">⚠️ Screen time limit reached! Go workout.</p>
    </div>

    <div class="card">
        <h2>💪 Weight & Protein Safety</h2>
        <input type="number" id="weight" placeholder="Weight (kg)">
        <input type="number" id="protein" placeholder="Daily Protein (g)">
        <button onclick="processHealthData()">Analyze & Save</button>
        <div id="proteinResult" class="alert"></div>
    </div>
</div>

<script>
    // App State Management (Clean & Professional)
    const App = {
        state: {
            weight: localStorage.getItem('weight') || '',
            protein: localStorage.getItem('protein') || '',
            screenSecs: parseInt(localStorage.getItem('screenSecs')) || 0
        },
        init() {
            document.getElementById('weight').value = this.state.weight;
            document.getElementById('protein').value = this.state.protein;
            if(this.state.weight && this.state.protein) this.calcProtein();
            this.startTimer();
        },
        save() {
            localStorage.setItem('weight', this.state.weight);
            localStorage.setItem('protein', this.state.protein);
        },
        startTimer() {
            setInterval(() => {
                this.state.screenSecs++;
                localStorage.setItem('screenSecs', this.state.screenSecs);
                const m = Math.floor(this.state.screenSecs / 60), s = this.state.screenSecs % 60;
                document.getElementById('screenTimer').innerText = `${m}m ${s}s`;
                if(m >= 30) document.getElementById('screenWarn').style.display = 'block';
            }, 1000);
        },
        calcProtein() {
            const w = parseFloat(this.state.weight), p = parseFloat(this.state.protein);
            const box = document.getElementById('proteinResult');
            if(!w || !p) return;
            
            const min = Math.round(w * 1.6), max = Math.round(w * 2.2);
            box.style.display = 'block';
            
            if(p > max) {
                box.className = 'alert alert-warn';
                box.innerHTML = `⚠️ <b>Excessive Intake:</b> Safe limit is <b>${min}g-${max}g</b>. Excess protein strains kidneys & digestion. Scale down to <b>${max}g</b>.`;
            } else if(p < min) {
                box.className = 'alert alert-warn';
                box.innerHTML = `ℹ️ <b>Low Intake:</b> Require at least <b>${min}g</b> for muscle recovery.`;
            } else {
                box.className = 'alert alert-safe';
                box.innerHTML = `✅ <b>Optimal Intake:</b> ${p}g is perfectly aligned with your body weight.`;
            }
        }
    };

    // UI Handlers
    function toggleDrawer(open) {
        document.getElementById('drawer').classList.toggle('active', open);
    }

    function processHealthData() {
        App.state.weight = document.getElementById('weight').value;
        App.state.protein = document.getElementById('protein').value;
        App.save();
        App.calcProtein();
    }

    function calcCheatBurn() {
        const kcal = parseFloat(document.getElementById('cheatFood').value);
        const w = parseFloat(App.state.weight) || 70; // fallback 70kg
        
        // Smart Calorie Burn Formula: Running burns ~0.0175 * MET(8) * weight_in_kg per min
        const minsToBurn = Math.round(kcal / (0.0175 * 8 * w));
        
        const res = document.getElementById('cheatResult');
        res.style.display = 'block';
        res.innerHTML = `🔥 <b>${kcal} kcal</b> burn karne ke liye aapko <b>${minsToBurn} minutes</b> running ya high-intensity workout karna hoga!`;
    }

    // Initialize App
    window.onload = () => App.init();
</script>
</body>
</html>
